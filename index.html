<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>TP-7 Tape Emulator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ========================================================= -->
    <!-- TOP BAR -->
    <!-- ========================================================= -->

    <header id="topbar">

        <div id="brand">
            TP-7 // TAPE EMULATOR
        </div>

        <button id="layout-toggle">
            ◫ PC UI
        </button>

    </header>


    <!-- ========================================================= -->
    <!-- MAIN -->
    <!-- ========================================================= -->

    <main id="main-container" class="pc">


        <!-- ===================================================== -->
        <!-- LEFT PANEL -->
        <!-- ===================================================== -->

        <section id="left-panel" class="panel">

            <!-- Upload -->

            <section id="upload-panel">

                <div class="section-label">
                    MEDIA SOURCE
                </div>

                <div id="drop-zone">

                    <div id="drop-text">
                        DROP AUDIO · OR TAP TO BROWSE
                    </div>

                </div>

                <div id="tape-name">
                    NO TAPE LOADED
                </div>

                <input
                    id="file-input"
                    type="file"
                    accept="audio/*"
                    hidden
                >

            </section>


            <!-- Wheel -->

            <section id="wheel-panel">

                <div class="section-label">
                    DRIVE WHEEL
                </div>

                <div id="wheel-outer">

                    <svg
                        id="wheel-svg"
                        viewBox="0 0 240 240"
                        xmlns="http://www.w3.org/2000/svg">

                        <g id="wheel-art"></g>

                    </svg>

                </div>

                <div id="wheel-status">
                    MOTOR STOPPED
                </div>

            </section>


            <!-- Buttons -->

            <section id="controls-panel">

                <div id="button-grid">

                    <button id="btn-play" class="control-button">
                        ▶
                    </button>

                    <button id="btn-pause" class="control-button">
                        ■
                    </button>

                    <button id="btn-ffwd" class="control-button">
                        ▶▶
                    </button>

                    <button id="btn-rewind" class="control-button">
                        ◀◀
                    </button>

                    <button id="btn-free" class="control-button">
                        FREE
                    </button>

                </div>

            </section>


            <!-- Speed -->

            <section id="speed-panel">

                <div id="speed-labels">

                    <span>-5.0×</span>

                    <span>SPEED</span>

                    <span>+5.0×</span>

                </div>

                <div id="speed-track">

                    <div id="speed-fill"></div>

                </div>

                <div id="speed-value">
                    0.00×
                </div>

            </section>

        </section>



        <!-- ===================================================== -->
        <!-- RIGHT PANEL -->
        <!-- ===================================================== -->

        <section id="right-panel">


            <!-- Odometer -->

            <section id="clock-panel" class="panel">

                <div class="section-label">
                    TAPE POSITION
                </div>

                <div id="odometer"></div>

            </section>


            <!-- Waveform -->

            <section id="wave-panel" class="panel">

                <div class="section-label">
                    WAVEFORM
                </div>

                <canvas
                    id="wave-canvas"
                    width="600"
                    height="60">
                </canvas>

            </section>


            <!-- Analyzer -->

            <section id="analyzer-panel" class="panel">

                <div class="section-label">
                    STEREO ANALYZER
                </div>

                <div id="analyzer-row">

                    <div class="channel">

                        <div class="channel-header">

                            <span>L</span>

                            <span id="peak-left">
                                -∞
                            </span>

                        </div>

                        <canvas
                            id="canvas-left"
                            width="256"
                            height="80">
                        </canvas>

                    </div>


                    <div id="db-scale">

                        <span>0</span>
                        <span>-12</span>
                        <span>-24</span>
                        <span>-36</span>
                        <span>-48</span>

                    </div>


                    <div class="channel">

                        <div class="channel-header">

                            <span id="peak-right">
                                -∞
                            </span>

                            <span>R</span>

                        </div>

                        <canvas
                            id="canvas-right"
                            width="256"
                            height="80">
                        </canvas>

                    </div>

                </div>

                <div id="correlation">

                    <span>CORR</span>

                    <div id="corr-track">

                        <div id="corr-fill"></div>

                    </div>

                    <span id="corr-value">
                        0.00
                    </span>

                </div>

            </section>

        </section>

    </main>


    <!-- ========================================================= -->
    <!-- STATUS BAR -->
    <!-- ========================================================= -->

    <footer id="statusbar">

        <div id="status-message">
            STANDBY · LOAD TAPE TO BEGIN
        </div>

        <div id="status-mode">
            OFFLINE
        </div>

    </footer>

</div>


<script type="module" src="main.js"></script>

</body>
</html>
